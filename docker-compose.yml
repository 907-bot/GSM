# docker-compose.yml
#
# Infrastructure only (default):
#   docker-compose up -d
#
# Full app stack (requires .env to be configured):
#   docker-compose --profile app up -d
#
# Need Docker Redis instead of local:
#   docker-compose --profile redis up -d
#
# NOTE: Redis is expected to run locally (brew services start redis).
#       A local Redis is already running on port 6379.

services:

  # ── Infrastructure (always started) ───────────────────────────────

  qdrant:
    image: qdrant/qdrant:v1.8.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - gsm-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  neo4j:
    image: neo4j:5.17-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/gsmos_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    networks:
      - gsm-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ── Optional: Docker Redis (skip if local Redis is running on 6379) ─

  redis:
    profiles: ["app", "redis"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - gsm-network

  # ── Application stack (profile: app) ──────────────────────────────

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
    depends_on:
      - qdrant
      - neo4j
      - redis
    networks:
      - gsm-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app worker -l info -c 4
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
    depends_on:
      - qdrant
      - neo4j
      - redis
    networks:
      - gsm-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  beat:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app beat -l info
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    networks:
      - gsm-network

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    depends_on:
      - api
    networks:
      - gsm-network

  # ── Monitoring (profile: app) ──────────────────────────────────────

  prometheus:
    profiles: ["app"]
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - gsm-network

  grafana:
    profiles: ["app"]
    image: grafana/grafana:latest
    ports:
      - "3004:3000"  # 3001 often taken by other local projects
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - gsm-network

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  gsm-network:
    driver: bridge
