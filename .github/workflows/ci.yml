name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  QDRANT_HOST: localhost
  QDRANT_PORT: 6333

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.8.0
        ports:
          - 6333:6333
    strategy:
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start PostgreSQL (if matrix)
        if: matrix.database == 'postgres'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql
          sudo -u postgres createuser -s runner
          sudo -u postgres createdb gsm_os_test
          echo "DATABASE_URL=postgresql://runner@localhost/gsm_os_test" >> $GITHUB_ENV
      - name: Set SQLite (default)
        if: matrix.database == 'sqlite'
        run: echo "DATABASE_URL=sqlite:///data/test_gsm_os.db" >> $GITHUB_ENV
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --timeout=30
        env:
          GSM_DB_PATH: /tmp/test_gsm_os.db
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
