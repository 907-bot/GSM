apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsm-os-api
  namespace: gsm-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gsm-os-api
  template:
    metadata:
      labels:
        app: gsm-os-api
    spec:
      containers:
      - name: api
        image: gsm-os/api:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: QDRANT_HOST
          value: "qdrant"
        - name: NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: REDIS_HOST
          value: "redis"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: gsm-secrets
              key: groq-api-key
        resources:
          limits:
            cpu: "4"
            memory: "8Gi"
          requests:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gsm-os-api
  namespace: gsm-os
spec:
  selector:
    app: gsm-os-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gsm-os-api
  namespace: gsm-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gsm-os-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
