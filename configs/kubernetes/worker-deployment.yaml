apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsm-os-worker
  namespace: gsm-os
spec:
  replicas: 5
  selector:
    matchLabels:
      app: gsm-os-worker
  template:
    metadata:
      labels:
        app: gsm-os-worker
    spec:
      containers:
      - name: worker
        image: gsm-os/worker:latest
        command: ["celery", "-A", "src.workers.celery_app", "worker", "-l", "info", "-c", "4"]
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: QDRANT_HOST
          value: "qdrant"
        - name: NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: REDIS_HOST
          value: "redis"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: gsm-secrets
              key: groq-api-key
        resources:
          limits:
            cpu: "4"
            memory: "8Gi"
          requests:
            cpu: "2"
            memory: "4Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gsm-os-worker
  namespace: gsm-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gsm-os-worker
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: External
    metric:
      name: celery_queue_length
      target:
        type: AverageValue
        averageValue: 100
