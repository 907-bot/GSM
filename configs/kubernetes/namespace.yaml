apiVersion: v1
kind: Namespace
metadata:
  name: gsm-os
---
apiVersion: v1
kind: Secret
metadata:
  name: gsm-secrets
  namespace: gsm-os
type: Opaque
stringData:
  # Groq free tier API key - get yours at https://console.groq.com/keys
  groq-api-key: ""
  # HuggingFace free token - https://huggingface.co/settings/tokens
  huggingface-api-key: ""
  neo4j-password: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gsm-config
  namespace: gsm-os
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  QDRANT_COLLECTION: "scientific_memory"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
